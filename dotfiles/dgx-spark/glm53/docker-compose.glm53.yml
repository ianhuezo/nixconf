services:
  vllm-glm53:
    image: ${GLM53_VLLM_IMAGE:-vllm-glm53-runtime:sm121-v14}
    network_mode: host
    ipc: host
    # "no" is deliberate and hard-won. A restart policy CANNOT recover a
    # multi-node mp deployment: Docker respawns each rank independently, so a
    # head failure leaves the worker alive on a TCPStore rendezvous it can
    # never complete, and the new head then meets a half-dead peer. We hit this
    # three times in one evening -- every crash became a confusing hang instead
    # of a clean failure, and one of them silently desynced the ranks for
    # 20 minutes.
    #
    # The policy's two jobs are handled properly elsewhere:
    #   - come back after the idle monitor's poweroff -> spark-model.service,
    #     which reads ~/dspark-recipe/.active-model and runs the right launcher
    #     with its worker-first ordering and memory ritual
    #   - recover from a crash -> spark-model-watchdog.timer, which tears down
    #     BOTH ranks before relaunching
    restart: "no"
    shm_size: "32gb"

    ulimits:
      memlock: -1
      stack: 67108864

    cap_add:
      - IPC_LOCK

    # Container memory ceiling. Default 0 = unlimited (normal operation).
    # Set GLM53_MEM_LIMIT when trying an unproven memory profile: on GB10 the
    # GPU allocates from system RAM, so an over-allocating kernel does not fail
    # cleanly -- it drives the HOST into swap thrash until sshd stops answering
    # and only a power cycle recovers it. That happened with b12x on 2026-08-28.
    # A cgroup cap turns that into a dead container instead of a dead node.
    # memswap_limit is set equal to mem_limit on purpose: that disables swap for
    # the container, so it OOMs promptly rather than thrashing its way there.
    mem_limit: ${GLM53_MEM_LIMIT:-0}
    memswap_limit: ${GLM53_MEM_LIMIT:-0}

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface
      # Node-local JIT caches, and a DIFFERENT directory from the DeepSeek
      # stack's ~/.cache/vllm-dspark on purpose. These hold compiled kernels
      # keyed to one vLLM build; the two models run different vLLM versions
      # from different images, and a cubin from one crashes the other.
      - ${GLM53_JIT_CACHE_DIR:-${HOME}/.cache/vllm-glm53}:/vllm-cache

    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-0}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"

      VLLM_CACHE_ROOT: /vllm-cache
      DG_JIT_CACHE_DIR: /vllm-cache/deepgemm-cache
      FLASHINFER_WORKSPACE_BASE: /vllm-cache/flashinfer
      TILELANG_CACHE_DIR: /vllm-cache/tilelang
      TORCHINDUCTOR_CACHE_DIR: /vllm-cache/torchinductor-cache
      TRITON_CACHE_DIR: /vllm-cache/triton-cache
      TORCH_EXTENSIONS_DIR: /vllm-cache/torch_extensions

      # 185 GiB of weights across two ranks takes ~10 minutes to load; the
      # stock 600s trips torch.distributed teardown and the second boot then
      # dies with no useful error.
      VLLM_ENGINE_READY_TIMEOUT_S: "${VLLM_ENGINE_READY_TIMEOUT_S:-3600}"
      VLLM_HOST_IP: "${VLLM_HOST_IP:-}"

      TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_CUDA_ARCH_LIST: "${FLASHINFER_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_DISABLE_VERSION_CHECK: "${FLASHINFER_DISABLE_VERSION_CHECK:-1}"
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"

      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-3}"
      NCCL_IB_ROCE_VERSION_NUM: "${NCCL_IB_ROCE_VERSION_NUM:-2}"
      NCCL_IB_ADDR_FAMILY: "${NCCL_IB_ADDR_FAMILY:-AF_INET}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      MN_IF_NAME: "${MN_IF_NAME:-${NCCL_SOCKET_IFNAME}}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_IB_MERGE_NICS: "${NCCL_IB_MERGE_NICS:-0}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "${TORCH_NCCL_ASYNC_ERROR_HANDLING:-1}"

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25100}"

    # The image's own ENTRYPOINT is ["vllm", "serve"], but two flags here are
    # conditional and an empty argv element is not the same as an absent flag,
    # so go through a shell and let it drop the empties.
    entrypoint: ["bash", "-c"]
    command:
      - >
        SPEC='${SPEC_METHOD:-none}';
        MTP='${MTP_NUM_TOKENS:-0}';
        KVM='${KV_CACHE_MEMORY:-}';
        SPEC_ARGS=;
        if [ "$${SPEC}" = mtp ] && [ -n "$${MTP}" ] && [ "$${MTP}" != 0 ]; then
        SPEC_ARGS="--speculative-config {\"method\":\"mtp\",\"num_speculative_tokens\":$${MTP}}";
        fi;
        if [ "$${SPEC}" = dflash ]; then
        D='${DFLASH2_MODEL:-incoai/GLM-5.3-Flash-DFlash2}';
        case "$${D}" in /*) ;; *)
        DHUB=/cache/huggingface/hub/models--$(printf %s "$${D}" | sed "s|/|--|g");
        DREV=$(cat "$${DHUB}/refs/main" 2>/dev/null);
        if [ -n "$${DREV}" ] && [ -d "$${DHUB}/snapshots/$${DREV}" ]; then
        D="$${DHUB}/snapshots/$${DREV}";
        else echo "FATAL: DFlash2 drafter $${D} is not in this rank's HF cache; run fetch-glm53-weights.sh draft" >&2; exit 1; fi;;
        esac;
        echo "drafter path: $${D}";
        SPEC_ARGS="--speculative-config {\"method\":\"dflash\",\"model\":\"$${D}\",\"num_speculative_tokens\":${DFLASH2_NUM_TOKENS:-7}}";
        fi;
        KV_ARGS=;
        if [ -n "$${KVM}" ]; then KV_ARGS="--kv-cache-memory $${KVM}"; fi;
        MM_ARGS="--limit-mm-per-prompt {\"image\":${MM_LIMIT_IMAGE:-8},\"video\":${MM_LIMIT_VIDEO:-1}}";
        MMC='${MM_PROCESSOR_CACHE_TYPE:-}';
        if [ -n "$${MMC}" ]; then MM_ARGS="$${MM_ARGS} --mm-processor-cache-type $${MMC}"; fi;
        M='${GLM53_MODEL:-local-inference-lab/GLM-5.3-Flash-NVFP4}';
        case "$${M}" in /*) ;; *)
        HUB=/cache/huggingface/hub/models--$(printf %s "$${M}" | sed "s|/|--|g");
        REV=$(cat "$${HUB}/refs/main" 2>/dev/null);
        if [ -n "$${REV}" ] && [ -d "$${HUB}/snapshots/$${REV}" ]; then
        M="$${HUB}/snapshots/$${REV}";
        else echo "WARN: could not resolve $${M} in the HF cache; vision will fail" >&2; fi;;
        esac;
        echo "serving model path: $${M}";
        exec vllm serve "$${M}"
        --served-model-name ${SERVED_MODEL_NAME:-glm-5.3-flash}
        --host ${VLLM_HOST:-0.0.0.0}
        --port ${VLLM_PORT:-8888}
        --trust-remote-code
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --max-model-len ${MAX_MODEL_LEN:-200000}
        --max-num-seqs ${MAX_NUM_SEQS:-5}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-2048}
        --block-size ${BLOCK_SIZE:-2304}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.90}
        --kv-cache-dtype ${KV_CACHE_DTYPE:-fp8_e4m3}
        --moe-backend ${MOE_BACKEND:-marlin}
        $${SPEC_ARGS}
        $${KV_ARGS}
        $${MM_ARGS}
        --enforce-eager
        --tool-call-parser glm47
        --enable-auto-tool-choice
        --reasoning-parser glm45
        --distributed-executor-backend mp
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25100}
        ${HEADLESS:+--headless}
        ${EXTRA_VLLM_ARGS:-}
