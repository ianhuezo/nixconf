# The Spark pair holds exactly one model at a time (~93-100 GiB per rank), so
# only one of the dgx-spark* provider families below answers at any moment.
# Switch the cluster with `model-select.sh` on node1, then point modelRoles at
# the matching family here. Same baseUrl either way -- both serve on :8888.
providers:
  dgx-spark:
    baseUrl: http://192.168.50.157:8888/v1
    api: openai-completions
    auth: none

    models:
      - id: deepseek-v4-flash-dspark
        name: DeepSeek V4 Flash 0731 (local, 2x GX10)
        api: openai-completions
        reasoning: true
        input: [text]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 262144
        maxTokens: 65536

  dgx-spark-worker:
    baseUrl: http://192.168.50.157:8888/v1
    api: openai-completions
    auth: none

    models:
      - id: deepseek-v4-flash-dspark
        name: DeepSeek V4 Flash 0731 (128K worker budget)
        api: openai-completions
        reasoning: true
        input: [text]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 131072
        maxTokens: 16384

  # GLM-5.3-Flash: 320B total / 18B active, now served from the EXL3/TR3 4bpw
  # quant with the DFlash2 block-diffusion drafter (Entrpi recipe), replacing
  # the NVFP4 build. fp8_e4m3 KV, CUDA graphs, no MTP -- DFlash2 beats it.
  #
  # 358400 is the server's --max-model-len, not a client-side preference: vLLM
  # rejects anything longer outright. It is 1.8x the NVFP4 stack's 200000.
  #
  # Why 358400 and not the recipe's 524288 default: concurrency is exactly
  # pool/context, so context is *spent* out of a fixed KV budget. 524288 buys
  # only 2.74 concurrent full-length banks, under the c3 floor this deployment
  # needs. Upstream's documented 358400 profile holds a 1,275,306-token pool =
  # 3.56 banks, and the server runs --max-num-seqs 5, so c3-c5 is guaranteed at
  # *declared* full length and not merely in expectation.
  #
  # In practice there is far more room than 3.56 suggests: real traffic on this
  # pair averages ~88K-token prompts (measured, n=545), where the pool seats
  # about fourteen sessions. The binding limit at that size is the 5 sequence
  # slots, not the pool -- which is the intended shape.
  #
  # Both roles therefore share one number now. The earlier split, capping
  # subagents to keep a fan-out inside the pool, was solving a problem the
  # 358400 profile removes.
  #
  # Thinking is OFF at the serving layer on this stack
  # (--default-chat-template-kwargs '{"enable_thinking": false}'), so
  # `reasoning: true` only takes effect for requests that ask for it
  # explicitly. Flipping the default means patching upstream's launcher, and
  # install.sh rewrites that file on every run.
  dgx-spark-glm:
    baseUrl: http://192.168.50.157:8888/v1
    api: openai-completions
    auth: none

    models:
      - id: glm-5.3-flash
        name: GLM-5.3-Flash EXL3 4bpw + DFlash2 (local, 2x GX10)
        api: openai-completions
        reasoning: true
        # Natively multimodal, and served with a vision tower — so while GLM is
        # the resident model this can also cover the vision role locally rather
        # than reaching for the MacBook. Server-side limit is 8 images and 1
        # video per request (MM_LIMIT_IMAGE / MM_LIMIT_VIDEO).
        input: [text, image]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 358400
        # 32768. Do NOT "optimise" this down from the output-length histogram.
        #
        # 84% of requests finish under 500 tokens, which makes a low cap look
        # free -- but those are file reads, tool calls and one-line edits. The
        # 10-20K tail is where the actual deliverables live: a full-file QML
        # rewrite is 600-1000 lines, i.e. 8-12K tokens of code before any
        # reasoning. Measured on this pair: 3 of 114 requests landed in the
        # 10-20K bucket, none above 20K, and every one of them was real work.
        #
        # Truncating those is the worst available outcome -- you wait ten
        # minutes and receive unparseable output. The model self-terminates well
        # before 32768, so this is a safety net that never binds, not a budget.
        maxTokens: 32768

  dgx-spark-glm-worker:
    baseUrl: http://192.168.50.157:8888/v1
    api: openai-completions
    auth: none

    models:
      - id: glm-5.3-flash
        name: GLM-5.3-Flash EXL3 (subagent budget)
        api: openai-completions
        reasoning: true
        input: [text, image]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 358400
        # 32768, same as the main role. Do NOT "optimise" this down from the output-length histogram.
        #
        # 84% of requests finish under 500 tokens, which makes a low cap look
        # free -- but those are file reads, tool calls and one-line edits. The
        # 10-20K tail is where the actual deliverables live: a full-file QML
        # rewrite is 600-1000 lines, i.e. 8-12K tokens of code before any
        # reasoning. Measured on this pair: 3 of 114 requests landed in the
        # 10-20K bucket, none above 20K, and every one of them was real work.
        #
        # Truncating those is the worst available outcome -- you wait ten
        # minutes and receive unparseable output. The model self-terminates well
        # before 32768, so this is a safety net that never binds, not a budget.
        maxTokens: 32768

  macbook-vision:
    baseUrl: http://192.168.50.134:8080/v1
    api: openai-completions
    auth: none

    models:
      - id: mlx-community/Qwen3.8-27B-8bit
        name: Qwen3.8-27B vision (MacBook M3 Max)
        api: openai-completions
        input: [text, image]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 32768
        maxTokens: 4096
